; g29-gadget - the ESP32-S3 presents itself to macOS as a Logitech G29 (046d:c24f).
;
; Milestone 1 of the GeForce NOW route: does a session start sending wheel force
; feedback to a device that merely *claims* to be a whitelisted wheel? See
; ../../docs/geforce-now.md.
;
; The native USB port must run TinyUSB (ARDUINO_USB_MODE=0) so a custom HID device can
; be presented; that means no USB-CDC serial on that port, and logs go out UART0 which
; is the board's CH343 bridge port (/dev/cu.usbmodem...) instead.
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1          ; the N16R8 module: 16MB flash / 8MB PSRAM, neither used
framework = arduino
monitor_speed = 115200
upload_speed = 115200               ; the CH343 bridge times out writing the stub at 460800
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0            ; TinyUSB on the native port (needed for custom HID)
    -DARDUINO_USB_CDC_ON_BOOT=0     ; the native port is the wheel, not a serial console
    -DCORE_DEBUG_LEVEL=3            ; 5 also logs the TinyUSB stack's own report routing
    -Wall
