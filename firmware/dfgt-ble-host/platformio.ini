; dfgt-ble-host — Stage 1: the ESP32-S3 hosts the Logitech Driving Force GT and
; presents it to macOS as a BLE HID gamepad.
;
; This is an ESP-IDF project (not Arduino): Arduino-ESP32 2.x has no USB *host*
; stack, and the S3's single USB peripheral has to be a host for the wheel here.
; The Arduino gadget project in ../g29-gadget still holds the port as a device
; and is untouched by this one — flashing either replaces the other.
;
; Console/logs come out of UART0, i.e. the board's CH343 bridge port, because
; the native port is the wheel's host port.
[platformio]
; PlatformIO's ESP-IDF builder reads src_dir from this section (not from [env]),
; and IDF projects keep their sources in main/.
src_dir = main

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 115200               ; the CH343 bridge times out writing the stub at 460800
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
